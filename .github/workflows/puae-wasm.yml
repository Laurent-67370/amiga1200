name: Cœur PUAE en WebAssembly

on:
  push:
    branches: [puae]
    paths: ["wasm/**", "vendor/puae", ".github/workflows/puae-wasm.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Installer Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 4.0.15
          "$HOME/emsdk/emsdk" activate 4.0.15
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Compiler le cœur
        run: |
          emcc --version | head -1
          if ! wasm/build.sh > build.log 2>&1; then
            grep -E "error|undefined symbol|Error" build.log | grep -v "Werror\|-Wno-error" | sort | uniq -c | sort -rn | head -25 | while read -r l; do echo "::error title=Compilation::$l"; done
            tail -5 build.log | while read -r l; do echo "::error title=Fin du journal::$l"; done
            exit 1
          fi
          tail -12 build.log

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Banc d'essai (A1200, AROS)
        working-directory: wasm/dist
        run: |
          mkdir -p sys
          note() { echo "::notice title=$1::$2"; echo "$2" >> "$GITHUB_STEP_SUMMARY"; }
          grep -E "objets du cœur|correctif|compressé" ../../build.log | while read -r l; do note "Compilation" "$l"; done
          ok=0
          for mode in normal exact; do
            set +e
            timeout 600 node puae-bench.js 150 500 $mode frame-$mode.ppm > out-$mode.txt 2>&1
            rc=$?
            set -e
            grep -E "images/s|sauvegarde" out-$mode.txt | while read -r l; do note "Banc $mode" "$l"; done
            if grep -q "images/s" out-$mode.txt; then ok=1; else
              note "Banc $mode en échec (code $rc)" "$(grep -v -E 'warning|^$' out-$mode.txt | tail -8 | tr '\n' ' ' | cut -c1-900)"
            fi
          done
          test $ok = 1

      - name: Publier la page d'essai dans /puae/ (branche main, GitHub Pages)
        run: |
          git fetch --depth 1 origin main
          git worktree add ../site-main origin/main
          rm -rf ../site-main/puae && mkdir -p ../site-main/puae
          cp wasm/dist/site/* ../site-main/puae/
          cd ../site-main
          git add puae
          if git diff --cached --quiet; then echo "rien à publier"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "Page d'essai PUAE : ${GITHUB_SHA::7}"
          git push origin HEAD:main
          echo "::notice title=Publié::https://laurent-67370.github.io/amiga1200/puae/"

      - uses: actions/upload-artifact@v4
        with:
          name: puae-wasm
          path: |
            wasm/dist/puae.js
            wasm/dist/puae.wasm
            wasm/dist/frame-*.ppm
            build.log
            wasm/dist/out-*.txt
