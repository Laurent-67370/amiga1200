<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amiga 1200 · cœur PUAE (essai)</title>
<link rel="icon" href="data:,">
<script src="coi.js"></script>
<style>
  :root { --wb-grey:#aaa; --wb-blue:#6688bb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a2f3a; color: #e8e6df; font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 14px; color: #b8c0cc; }
  .screen { background: #000; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  /* L'Amiga affichait ses pixels étirés en 4:3 : le canvas remplit l'écran 4:3 au lieu de garder ses proportions brutes. */
  canvas { width: 100%; height: 100%; object-fit: fill; image-rendering: auto; display: block; }
  .bar { margin-top: 12px; background: var(--wb-grey); color: #000; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
         border: 1px solid; border-color: #fff #000 #000 #fff; }
  button, label.file { appearance: none; background: var(--wb-grey); color: #000; font: inherit; font-size: 14px; padding: 5px 10px; cursor: pointer;
         border: 2px solid; border-color: #fff #000 #000 #fff; }
  button:active { border-color: #000 #fff #fff #000; }
  button.primary { background: var(--wb-blue); color: #fff; }
  button:disabled { color: #666; }
  label.file input { display: none; }
  select { font: inherit; font-size: 14px; }
  .stat { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; }
  .led { display: inline-block; width: 18px; height: 6px; background: #3a3a2e; margin: 0 3px 0 8px; vertical-align: 1px; }
  .led.on.g { background: #4dff6a; } .led.on.a { background: #ffb020; }
  .names { font-size: 13px; color: #222; }
  pre { background: #11141a; color: #9aa3ad; padding: 10px; max-height: 180px; overflow: auto; font-size: 12px; margin-top: 12px; }
  .warn { background: #5a3a20; padding: 10px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<main>
  <h1>Amiga 1200 avec le cœur PUAE</h1>
  <p class="lead">Page d'essai de l'étape 2 : le moteur de WinUAE compilé en WebAssembly. Sans Kickstart, la machine démarre sur AROS. Cliquez dans l'écran pour capturer la souris, Échap pour la libérer.</p>
  <div class="warn" id="warn"></div>
  <div class="screen"><canvas id="screen" width="720" height="568"></canvas></div>

  <div class="bar">
    <label class="file">Kickstart…<input type="file" id="fKick" accept=".rom,.bin"></label>
    <label class="file">rom.key…<input type="file" id="fKey" accept=".key"></label>
    <label class="file">Disquette DF0:…<input type="file" id="fDisk" accept=".adf,.dms,.adz,.zip"></label>
    <select id="compat" title="Précision"><option value="normal">Rapide</option><option value="exact">Cycle exact</option></select>
    <button class="primary" id="bStart">Allumer</button>
    <span class="names" id="names">Kickstart : AROS · DF0: vide</span>
  </div>
  <div class="bar">
    <button id="bReset" disabled>Réinitialiser</button>
    <button id="bPause" disabled>Pause</button>
    <button id="bMute" disabled>Couper le son</button>
    <button id="bSave" disabled>Sauver l'état</button>
    <button id="bLoad" disabled>Restaurer l'état</button>
    <span class="stat"><span id="fps">—</span>
      <span class="led g" id="lPow"></span>Power<span class="led a" id="lDf"></span>DF0<span class="led a" id="lHd"></span>HD</span>
  </div>
  <pre id="log"></pre>
</main>

<script src="puae.js"></script>
<script type="module">
import { PuaeMachine } from "./puae-frontend.js";
const $ = s => document.querySelector(s);
const log = t => { const l = $("#log"); l.textContent += t + "\n"; l.scrollTop = l.scrollHeight; };
const files = { kick: null, key: null, disk: null };
let m = null, state = null;
window.__puae = { get machine() { return m; }, log };

if (!window.crossOriginIsolated) {
  const w = $("#warn"); w.style.display = "block";
  w.textContent = "Isolation inter-origines inactive : rechargez la page une fois. Sans elle, les fils d'exécution du cœur ne peuvent pas démarrer.";
}
const read = f => f.arrayBuffer().then(b => new Uint8Array(b));
const showNames = () => $("#names").textContent =
  `Kickstart : ${files.kick ? files.kick.name : "AROS"}${files.key ? " + rom.key" : ""} · DF0: ${files.disk ? files.disk.name : "vide"}`;
$("#fKick").onchange = async e => { const f = e.target.files[0]; if (f) { files.kick = { name: f.name, bytes: await read(f) }; showNames(); } };
$("#fKey").onchange = async e => { const f = e.target.files[0]; if (f) { files.key = { name: f.name, bytes: await read(f) }; showNames(); } };
$("#fDisk").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  files.disk = { name: f.name, bytes: await read(f) }; showNames();
  if (m && m.running) log(m.insertDisk(f.name, files.disk.bytes) ? `${f.name} insérée dans DF0:` : "Changement de disquette refusé par le cœur");
};

$("#bStart").onclick = async () => {
  $("#bStart").disabled = true;
  try {
    const t0 = performance.now();
    m = await PuaeMachine.create({ canvas: $("#screen"), factory: window.createPuae, onLog: log,
      onStats: s => {
        $("#fps").textContent = s.fps.toFixed(1) + " images/s";
        $("#lPow").classList.toggle("on", !!s.leds.power); $("#lDf").classList.toggle("on", !!s.leds.df0); $("#lHd").classList.toggle("on", !!s.leds.hd);
      } });
    log(`Module chargé en ${Math.round(performance.now() - t0)} ms`);
    await m.start({ model: "A1200OG", kickstart: files.kick && files.kick.bytes, romKey: files.key && files.key.bytes,
                    df0: files.disk, compat: $("#compat").value });
    log(`Démarré : ${m.fps.toFixed(2)} images/s visées, son à ${m.rate} Hz`);
    ["#bReset", "#bPause", "#bMute", "#bSave", "#bLoad"].forEach(s => $(s).disabled = false);
    $("#bStart").textContent = "Allumé";
  } catch (e) { log("Erreur : " + (e.message || e)); $("#bStart").disabled = false; }
};
$("#bReset").onclick = () => m.reset();
$("#bPause").onclick = () => { m.pause(!m.paused); $("#bPause").textContent = m.paused ? "Reprendre" : "Pause"; };
$("#bMute").onclick = () => { m.setMuted(!m.muted); $("#bMute").textContent = m.muted ? "Rétablir le son" : "Couper le son"; };
$("#bSave").onclick = () => { const t = performance.now(); state = m.saveState(); log(state ? `État sauvé : ${(state.length / 1048576).toFixed(1)} Mo en ${Math.round(performance.now() - t)} ms` : "Sauvegarde refusée"); };
$("#bLoad").onclick = () => { if (!state) return log("Aucun état sauvé"); log(m.loadState(state) ? "État restauré" : "Restauration refusée"); };
</script>
</body>
</html>
