name: Construire et publier le site

# main : version principale (cœurs PUAE et WinUAE 6) à la racine, ancienne version (SAE) dans sae/.
# Autres branches (essais) : publiées dans /<nom de la branche>/.
# Les publications sont faites avec GITHUB_TOKEN : elles ne relancent pas ce workflow.
on:
  push:
    paths: ["wasm/**", "wasm-amiberry/**", "vendor/**", "src/**", "build.py", ".github/workflows/puae-wasm.yml"]
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Installer Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 4.0.15
          "$HOME/emsdk/emsdk" activate 4.0.15
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      # Cœur WinUAE 6 (Amiberry) : sources clonées et objets gardés d'une compilation à l'autre
      - uses: actions/cache@v4
        with:
          path: wasm-amiberry/src
          key: amiberry-${{ hashFiles('wasm-amiberry/build.sh', 'wasm-amiberry/patches/**') }}
          restore-keys: amiberry-

      - name: Compiler le cœur WinUAE 6 (Amiberry)
        run: |
          if ! wasm-amiberry/build.sh > amb.log 2>&1; then
            grep -E "error|undefined symbol" amb.log wasm-amiberry/out/make.log 2>/dev/null | grep -v "Werror\|-Wno-error\|unknown argument\|-lutil\|wasm-ld @" | sort | uniq -c | sort -rn | head -25 | while read -r l; do echo "::error title=Compilation WinUAE 6::$l"; done
            tail -5 amb.log | while read -r l; do echo "::error title=Fin du journal::$l"; done
            exit 1
          fi
          tail -4 amb.log

      - name: Compiler le cœur
        run: |
          emcc --version | head -1
          if ! wasm/build.sh > build.log 2>&1; then
            grep -E "error|undefined symbol|Error" build.log | grep -v "Werror\|-Wno-error" | sort | uniq -c | sort -rn | head -25 | while read -r l; do echo "::error title=Compilation::$l"; done
            tail -5 build.log | while read -r l; do echo "::error title=Fin du journal::$l"; done
            exit 1
          fi
          tail -12 build.log

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Banc d'essai (A1200, AROS)
        working-directory: wasm/dist
        run: |
          mkdir -p sys
          note() { echo "::notice title=$1::$2"; echo "$2" >> "$GITHUB_STEP_SUMMARY"; }
          grep -E "objets du cœur|correctif|compressé" ../../build.log | while read -r l; do note "Compilation" "$l"; done
          ok=0
          for mode in normal exact; do
            set +e
            timeout 600 node puae-bench.js 150 500 $mode frame-$mode.ppm > out-$mode.txt 2>&1
            rc=$?
            set -e
            grep -E "images/s|sauvegarde" out-$mode.txt | while read -r l; do note "Banc $mode" "$l"; done
            if grep -q "images/s" out-$mode.txt; then ok=1; else
              note "Banc $mode en échec (code $rc)" "$(grep -v -E 'warning|^$' out-$mode.txt | tail -8 | tr '\n' ' ' | cut -c1-900)"
            fi
          done
          test $ok = 1

      - name: Banc d'essai WinUAE 6 (A1200 et A500, AROS)
        working-directory: wasm-amiberry/out
        run: |
          note() { echo "::notice title=$1::$2"; echo "$2" >> "$GITHUB_STEP_SUMMARY"; }
          grep -E "compressé" ../../amb.log | while read -r l; do note "Compilation WinUAE 6" "$l"; done
          for model in A1200OG A500; do
            timeout 600 node amb-bench.js 150 300 $model frame-$model.ppm > out-$model.txt 2>&1 || true
            grep -E "images/s|sauvegarde" out-$model.txt | while read -r l; do note "WinUAE 6 $model" "$l"; done
            grep -q "images/s" out-$model.txt || { note "WinUAE 6 $model en échec" "$(tail -8 out-$model.txt | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          done

      - name: Construire l'ancienne version (SAE)
        run: python3 build.py

      - name: Publier
        run: |
          git fetch --depth 1 origin main
          git worktree add ../site-main origin/main
          SITE=../site-main
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # Version principale à la racine
            for f in index.html essai.html puae.js puae.wasm amiberry.js amiberry.wasm puae-frontend.js adf.js hdf.js lha.js ffs.js coi.js coi-sw.js aros-rom.bin.gz aros-ext.bin.gz \
                     manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
              cp "wasm/dist/site/$f" "$SITE/$f"
            done
            mkdir -p "$SITE/sae" && cp sae/index.html "$SITE/sae/index.html"
            # Ancienne adresse d'essai : redirection vers l'accueil
            rm -rf "$SITE/puae" && mkdir -p "$SITE/puae"
            printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>Amiga 1200</title>' \
              '<meta http-equiv="refresh" content="0; url=../">' \
              '<p>La version PUAE est maintenant la page principale : <a href="../">Amiga 1200</a>.</p>' > "$SITE/puae/index.html"
            ADD=". "; URL="https://laurent-67370.github.io/amiga1200/"
          else
            DIR="$GITHUB_REF_NAME"
            rm -rf "$SITE/$DIR" && mkdir -p "$SITE/$DIR" && cp wasm/dist/site/* "$SITE/$DIR/"
            ADD="$DIR"; URL="https://laurent-67370.github.io/amiga1200/$DIR/"
          fi
          cd "$SITE"
          git add -A $ADD
          if git diff --cached --quiet; then echo "rien à publier"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publication ($GITHUB_REF_NAME) : ${GITHUB_SHA::7}"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase origin main; done
          echo "::notice title=Publié::$URL"

      - uses: actions/upload-artifact@v4
        with:
          name: puae-wasm
          path: |
            wasm/dist/puae.js
            wasm/dist/puae.wasm
            wasm/dist/frame-*.ppm
            build.log
            wasm/dist/out-*.txt
